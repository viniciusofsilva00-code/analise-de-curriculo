<style id="painel-css">
/* triagem_cv · um projeto vini_lab. Tokens do design system vini_lab (papel quadriculado, base preto e branco, neon ≤5% da área).
   Layout: mesa de trabalho do recrutador — cabeçalho com a vaga, abas por candidato, fichas de entrevista empilhadas. */
:root{
  --bg:#fafafa; --surface:#ffffff; --sunk:#f4f4f6; --line:#e7e7ec; --fg:#0a0a0a; --muted:#5c5c66; --grid:#0a0a0a0b;
  --neon:#ff2bd6; --accent:#e6007e; --accent-soft:#ff2bd61a; --accent-fg:#0a0a0a; --neon-mark:#ff2bd659;
  --inverse-bg:#0a0a0a; --inverse-fg:#f4f4f5; --chip-bg:#0a0a0a; --chip-ring:#ff2bd600;
  --ok:#1f7a3a; --ok-soft:#e6f4ea; --warn:#9a5b00; --warn-soft:#fbf0dc; --bad:#b3261e; --bad-soft:#fbe4e2;
  --glow:0 0 0 1px #ff2bd659, 0 8px 30px -10px #ff2bd68c; --shadow-1:0 1px 2px #0a0a0a0f;
  --f-body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --f-display:"Space Grotesk","Inter",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --r-btn:10px; --r-chip:8px; --r-tag:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0a0a; --surface:#141417; --sunk:#1b1b20; --line:#2e2e35; --fg:#f4f4f5; --muted:#c9c9d1; --grid:#ffffff0b;
  --accent:#ff5ce0; --accent-soft:#ff2bd61f; --neon-mark:#ff2bd673; --inverse-bg:#1c0b19; --chip-bg:#141417; --chip-ring:#ff2bd659;
  --ok:#7cc983; --ok-soft:#14301d; --warn:#e3a94a; --warn-soft:#33270f; --bad:#f08a80; --bad-soft:#3a1a18;
  --glow:0 0 0 1px #ff2bd666, 0 8px 30px -10px #ff2bd6a6; --shadow-1:0 1px 2px #0000004d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0a0a; --surface:#141417; --sunk:#1b1b20; --line:#2e2e35; --fg:#f4f4f5; --muted:#c9c9d1; --grid:#ffffff0b;
  --accent:#ff5ce0; --accent-soft:#ff2bd61f; --neon-mark:#ff2bd673; --inverse-bg:#1c0b19; --chip-bg:#141417; --chip-ring:#ff2bd659;
  --ok:#7cc983; --ok-soft:#14301d; --warn:#e3a94a; --warn-soft:#33270f; --bad:#f08a80; --bad-soft:#3a1a18;
  --glow:0 0 0 1px #ff2bd666, 0 8px 30px -10px #ff2bd6a6; --shadow-1:0 1px 2px #0000004d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px,var(--bg);background-attachment:fixed}
body ::selection{background:var(--neon);color:#0a0a0a}
.painel{color:var(--fg);font-family:var(--f-body)}
.painel .wrap{max-width:1120px;margin:0 auto;padding-left:16px;padding-right:16px}
.painel header.top{position:relative;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.painel header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--neon),transparent);opacity:.6}
.painel .vl-brand{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font:700 1.05rem/1 var(--f-mono);letter-spacing:-.02em}
.painel .vl-chip{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:var(--r-chip);background:var(--chip-bg);color:var(--neon);font:700 12px/1 var(--f-mono);box-shadow:inset 0 0 0 1px var(--chip-ring),0 0 18px -4px var(--neon)}
.painel .vl-cursor{display:inline-block;width:.5em;height:.74em;margin-left:.12em;background:var(--neon);transform:translateY(.04em);animation:vl-blink 1.1s step-end infinite}
@keyframes vl-blink{50%{opacity:0}}
.painel .vl-endosso{font:500 12px/1 var(--f-mono);color:var(--muted);letter-spacing:0}
.painel .vl-marca-texto{background:linear-gradient(transparent 62%,var(--neon-mark) 62%);padding:0 .06em}
.painel header.top .wrap{padding-block:20px 14px;display:flex;flex-direction:column;gap:10px}
.painel .eyebrow{font:500 12px/1.4 var(--f-mono);color:var(--muted)}
.painel h1{font:700 clamp(26px,4vw,40px)/1.1 var(--f-display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.painel h2{font:600 1.25rem/1.3 var(--f-display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.painel h3{font:600 15px/1.3 var(--f-display);letter-spacing:-.01em;margin:0}
.painel .meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:13.5px}
.painel .meta b{color:var(--fg);font-weight:600}
.painel .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.painel button{font:600 13px/1.2 var(--f-mono);letter-spacing:-.01em;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;border-radius:var(--r-btn);cursor:pointer;transition:box-shadow .12s cubic-bezier(.2,.7,.2,1),border-color .12s}
.painel button:hover{border-color:var(--neon)}
.painel button.primary{background:var(--neon);color:var(--accent-fg);border-color:var(--neon)}
.painel button.primary:hover{box-shadow:var(--glow)}
.painel button:focus-visible,.painel input:focus-visible,.painel textarea:focus-visible,.painel select:focus-visible,.painel label.seg:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.painel .savestate{font:12px var(--f-mono);color:var(--muted)}
.painel nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.painel nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.painel nav.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:12px 12px 9px;white-space:nowrap;color:var(--muted);display:flex;gap:8px;align-items:center;font:500 13.5px var(--f-mono)}
.painel nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--neon)}
.painel nav.tabs button:hover{box-shadow:none}
.painel nav.tabs .mini{font:500 11.5px var(--f-mono);padding:2px 6px;border-radius:var(--r-tag);border:1px solid var(--line);background:var(--surface)}
.painel main .wrap{padding-block:22px 60px;display:flex;flex-direction:column;gap:22px}
.painel section.panel{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow-1)}
.painel section.panel::before{content:"";position:absolute;top:-1px;left:24px;width:36px;height:3px;background:var(--neon);border-radius:0 0 2px 2px}
@media (max-width:520px){.painel section.panel{padding:18px}.painel section.panel::before{left:18px}}
.painel .sub{color:var(--muted);font-size:13.5px;margin:0}
.painel .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-btn);max-width:100%}
.painel table{border-collapse:collapse;width:100%;font-size:14px}
.painel th,.painel td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.painel th{font:500 12px var(--f-mono);color:var(--muted);background:var(--sunk)}
.painel tr:last-child td{border-bottom:0}
.painel .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.painel input[type=number]{width:64px;font:14px var(--f-mono);padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg)}
.painel textarea{width:100%;min-height:62px;font:14px/1.5 var(--f-body);padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--bg);color:var(--fg);resize:vertical}
.painel select{font:14px var(--f-body);padding:7px 9px;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--bg);color:var(--fg);max-width:100%}
.painel .chip{display:inline-block;font:500 11.5px/1.7 var(--f-mono);padding:1px 8px;border-radius:var(--r-tag);white-space:nowrap;border:1px solid transparent}
.painel .chip.top{background:var(--accent-soft);color:var(--fg);border-color:var(--neon)}
.painel .chip.res{background:var(--surface);color:var(--muted);border-color:var(--line)}
.painel .chip.eli{background:var(--bad-soft);color:var(--bad)}
.painel .chip.ok{background:var(--ok-soft);color:var(--ok)}
.painel .chip.warn{background:var(--warn-soft);color:var(--warn)}
.painel .chip.bad{background:var(--bad-soft);color:var(--bad)}
.painel .chip.o{background:var(--fg);color:var(--bg)}
.painel .chip.d{background:var(--surface);color:var(--muted);border-color:var(--line)}
.painel .tag{display:inline-block;font:600 11px/1.6 var(--f-body);padding:0 6px;border-radius:4px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.painel .tag.escrito{background:var(--ok-soft);color:var(--ok)}
.painel .tag.declarado{background:var(--warn-soft);color:var(--warn)}
.painel .tag.inferencia{background:var(--accent-soft);color:var(--accent)}
.painel .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.painel .grid3>*{min-width:0}
.painel .list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.painel .quote{font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:4px 0 0}
.painel .quote::before{content:"“"}.painel .quote::after{content:"”"}
.painel .inf{font-style:italic;color:var(--warn)}
.painel .scorebar{display:flex;flex-wrap:wrap;gap:10px}
.painel .score{background:var(--sunk);border-radius:var(--r-btn);padding:10px 14px;min-width:120px;flex:1}
.painel .score .k{font:500 12px var(--f-mono);color:var(--muted)}
.painel .score .v{font:600 24px var(--f-mono);font-variant-numeric:tabular-nums}
.painel .score.final{background:var(--inverse-bg);color:var(--inverse-fg)}
.painel .score.final .k{color:var(--inverse-fg);opacity:.75}
.painel .alertbox{border-radius:var(--r-btn);padding:10px 12px;font-size:14px}
.painel .alertbox.bad{background:var(--bad-soft);color:var(--bad)}
.painel .alertbox.warn{background:var(--warn-soft);color:var(--warn)}
.painel .alertbox.ok{background:var(--ok-soft);color:var(--ok)}
.painel .q{border:1px solid var(--line);border-radius:var(--r-btn);padding:14px;display:flex;flex-direction:column;gap:10px;border-left-width:4px;min-width:0}
.painel .q[data-st="C"]{border-left-color:var(--ok)}.painel .q[data-st="P"]{border-left-color:var(--warn)}.painel .q[data-st="N"]{border-left-color:var(--bad)}
.painel .q[data-filled="1"]{border-left-color:var(--neon)}
.painel .qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.painel .qhead .chip{white-space:normal;max-width:100%}
.painel .qid{font:600 13px var(--f-mono);color:var(--muted)}
.painel .qtext{font-weight:600;margin:0}
.painel .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.painel .pair>div{background:var(--sunk);border-radius:var(--r-tag);padding:8px 10px;font-size:13.5px;min-width:0}
.painel .pair .lab{font:500 11.5px var(--f-mono);display:block;margin-bottom:2px}
.painel .pair .good .lab{color:var(--ok)}.painel .pair .bad .lab{color:var(--bad)}
.painel .rubric{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.painel .rubric>div{background:var(--sunk);border-radius:var(--r-tag);padding:8px 10px;font-size:13px;min-width:0}
.painel .rubric b{font-family:var(--f-mono)}
.painel .segs{display:flex;flex-wrap:wrap;gap:6px}
.painel label.seg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r-tag);padding:6px 10px;font:500 13px var(--f-mono);cursor:pointer;background:var(--surface);position:relative}
.painel label.seg input{position:absolute;opacity:0;width:1px;height:1px}
.painel label.seg:has(input:checked){background:var(--neon);color:var(--accent-fg);border-color:var(--neon)}
.painel label.seg.sC:has(input:checked){background:var(--ok);border-color:var(--ok);color:var(--surface)}
.painel label.seg.sP:has(input:checked){background:var(--warn);border-color:var(--warn);color:var(--surface)}
.painel label.seg.sN:has(input:checked){background:var(--bad);border-color:var(--bad);color:var(--surface)}
.painel details{border:1px solid var(--line);border-radius:var(--r-btn);padding:0 12px;min-width:0}
.painel details[open]{padding-bottom:12px}
.painel summary{cursor:pointer;padding:10px 0;font-weight:600}
.painel .formula{font:500 13.5px/1.7 var(--f-mono);background:var(--inverse-bg);color:var(--inverse-fg);padding:12px 16px;border-radius:var(--r);overflow-x:auto}
.painel .weights{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.painel .weights label{display:flex;gap:6px;align-items:center;font-size:14px}
.painel .cmp td.best{font-weight:700;color:var(--accent)}
.painel .hint{font-size:13px;color:var(--muted)}
.painel .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.painel .confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.painel .iobox{display:flex;flex-direction:column;gap:8px}
.painel .iobox textarea{font-family:var(--f-mono);font-size:12px;min-height:120px}
.painel label.chk{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;margin-top:6px}
@media (max-width:640px){.painel .pair,.painel .rubric{grid-template-columns:1fr}.painel .score{min-width:44%}}
@media (prefers-reduced-motion:reduce){.painel *{transition:none!important}.painel .vl-cursor{animation:none}}

<!-- PAINEL:ENGINE:INICIO -->
<script id="painel-engine">
/* Motor do painel. Uma implementação só do cálculo de score (PainelSelecao.calc).
   O mesmo código roda no painel.html gerado pela skill e dentro do app do claude.ai. */
(function(global){
"use strict";
const ST = {C:{t:"Confirmado",v:100,cls:"ok"},P:{t:"Parcial",v:50,cls:"warn"},N:{t:"Não confirmado",v:0,cls:"bad"}};
const NAT = {escrito:"Escrito",declarado:"Declarado, não evidenciado",inferencia:"Inferência",ausente:"Ausente"};
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch])); }
const fmt = v => v===null||v===undefined||isNaN(v) ? "—" : v.toFixed(1).replace(".",",");

/* ================= CÁLCULO (fonte única) ================= */
const calc = {
  /** Score de triagem = soma(nota/5 × peso) ÷ soma dos pesos × 100 */
  triagem(notas, criterios, pesos){
    let soma=0, tot=0;
    criterios.forEach(c=>{
      const p = Number(pesos && pesos[c.id]!=null ? pesos[c.id] : c.peso) || 0;
      const n = notas && notas[c.id] ? Number(notas[c.id].nota)||0 : 0;
      tot += p; soma += (n/5)*p;
    });
    return tot ? soma/tot*100 : 0;
  },
  obrigPts(notas, criterios){
    return criterios.filter(c=>c.tipo==="O").reduce((a,c)=>a+(notas&&notas[c.id]?Number(notas[c.id].nota)||0:0),0);
  },
  /** Ranking dos candidatos em disputa: score, depois soma dos obrigatórios, depois ordemRecencia (1 = mais recente/próxima). */
  ranking(candidatos, criterios, pesos){
    return candidatos.map(c=>({id:c.id, score:calc.triagem(c.notas,criterios,pesos), obr:calc.obrigPts(c.notas,criterios), rec:Number(c.ordemRecencia)||999}))
      .sort((x,y)=> (y.score-x.score) || (y.obr-x.obr) || (x.rec-y.rec));
  },
  /** Avisos de fronteira entre o 3º e o 4º lugar. */
  avisos(rk, nomes){
    const out=[];
    if(rk.length>=4){
      const a=rk[2], b=rk[3], n=id=>(nomes&&nomes[id])||id;
      if(a.score-b.score<3) out.push(`Margem do 3º (${n(a.id)}, ${fmt(a.score)}) para o 4º (${n(b.id)}, ${fmt(b.score)}) é de ${fmt(a.score-b.score)} ponto(s), menor que 3.`);
      if(a.obr===b.obr) out.push(`3º (${n(a.id)}) e 4º (${n(b.id)}) empatam na soma dos obrigatórios (${a.obr}).`);
    }
    if(rk.length<3) out.push(`Só ${rk.length} candidato(s) passaram no filtro. A lista não foi completada com quem não atende.`);
    return out;
  },
  validacao(respA){
    const vals=Object.values(respA||{}).filter(x=>x&&x.s).map(x=>ST[x.s].v);
    return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  },
  aderencia(respB){
    const vals=Object.values(respB||{}).filter(x=>x&&x.s>0).map(x=>x.s/5*100);
    return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  },
  final(T,V,A,fase){
    const w=(+fase.t||0)+(+fase.v||0)+(+fase.a||0);
    if(V===null||A===null||!w) return null;
    return ((+fase.t||0)*T + (+fase.v||0)*V + (+fase.a||0)*A)/w;
  }
};

function dataBR(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||""); return m? `${m[3]}/${m[2]}/${m[1]}` : (iso||""); }

let current = null; // instância montada (para desmontar ao importar outro processo)

function mount(root, processo, opts){
  opts = opts || {};
  if(current) current.destroy();
  const ctl = new AbortController(); const on=(t,f)=>root.addEventListener(t,f,{signal:ctl.signal});
  const P = JSON.parse(JSON.stringify(processo));
  const V = P.vaga, CRIT = P.criterios, OBRIG = CRIT.filter(c=>c.tipo==="O").map(c=>c.id);
  const ALL = P.candidatos;
  const BYID = Object.fromEntries(ALL.map(c=>[c.id,c]));
  const APROV = ALL.filter(c=>c.status==="aprovado");
  const LIMI = ALL.filter(c=>c.status==="limitrofe");
  const FORA = ALL.filter(c=>c.status!=="aprovado");
  const TOP3 = (P.top3||[]).filter(id=>BYID[id]);
  const PQ = (P.perguntas&&P.perguntas.porCandidato)||{};
  const BCOM = (P.perguntas&&P.perguntas.comuns)||[];
  const NOMES = Object.fromEntries(ALL.map(c=>[c.id,c.nome]));
  const showCity = !!V.exigePresenca;
  const STORE_KEY = "selecao-" + V.id + "-v1";
  const critNome = id => { const c=CRIT.find(x=>x.id===id); return c? c.nome : id; };
  const qA = cid => (PQ[cid]&&PQ[cid].A)||[];
  const bFor = cid => BCOM.concat(PQ[cid]&&PQ[cid].B7 ? [PQ[cid].B7] : []);
  const firstNames = {}; ALL.forEach(c=>{ const f=c.nome.split(" ")[0]; firstNames[f]=(firstNames[f]||0)+1; });
  const shortName = cid => { const f=BYID[cid].nome.split(" ")[0]; return firstNames[f]>1? BYID[cid].nome : f; };

  /* ---------- estado (respostas) ---------- */
  function freshState(){
    const s={pesos:{}, fase:{t:30,v:30,a:40}, incluirLimitrofes:[], resp:{}, decisao:{cand:"",texto:""}, salvoEm:null};
    CRIT.forEach(c=>s.pesos[c.id]=c.peso);
    TOP3.forEach(cid=>{
      s.resp[cid]={A:{},B:{}};
      qA(cid).forEach(q=>s.resp[cid].A[q.id]={s:"",n:""});
      bFor(cid).forEach(q=>s.resp[cid].B[q.id]={s:0,n:""});
    });
    return s;
  }
  function mergeState(base, inc){
    if(!inc || typeof inc!=="object") return base;
    if(inc.pesos) CRIT.forEach(c=>{ const v=Number(inc.pesos[c.id]); if(inc.pesos[c.id]!=null&&isFinite(v)&&v>=0) base.pesos[c.id]=v; });
    if(inc.fase) ["t","v","a"].forEach(k=>{ const v=Number(inc.fase[k]); if(inc.fase[k]!=null&&isFinite(v)&&v>=0) base.fase[k]=v; });
    if(Array.isArray(inc.incluirLimitrofes)) base.incluirLimitrofes=inc.incluirLimitrofes.filter(id=>LIMI.some(c=>c.id===id));
    if(inc.resp) TOP3.forEach(cid=>{
      const r=inc.resp[cid]; if(!r) return;
      Object.keys(base.resp[cid].A).forEach(q=>{ const x=r.A&&r.A[q]; if(x){ if(["","C","P","N"].includes(x.s)) base.resp[cid].A[q].s=x.s; base.resp[cid].A[q].n=String(x.n||""); }});
      Object.keys(base.resp[cid].B).forEach(q=>{ const x=r.B&&r.B[q]; if(x){ const v=Number(x.s); if([0,1,2,3,4,5].includes(v)) base.resp[cid].B[q].s=v; base.resp[cid].B[q].n=String(x.n||""); }});
    });
    if(inc.decisao){ base.decisao.cand=String(inc.decisao.cand||""); base.decisao.texto=String(inc.decisao.texto||""); }
    if(inc.salvoEm) base.salvoEm=inc.salvoEm;
    return base;
  }
  let state = mergeState(freshState(), P.respostas);
  if(!opts.ignorarArmazenamento){
    try{
      const raw=localStorage.getItem(STORE_KEY);
      if(raw){ const ls=JSON.parse(raw); if(ls && ls.salvoEm && (!state.salvoEm || ls.salvoEm>state.salvoEm)) state=mergeState(freshState(), ls); }
    }catch(e){}
  }
  let saveTimer=null;
  function persist(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{
      state.salvoEm=new Date().toISOString();
      let ok=false; try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); ok=true; }catch(e){}
      const el=root.querySelector("#savestate");
      if(el) el.textContent = ok ? "Salvo neste navegador às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) : "Sem armazenamento local: exporte o JSON para não perder";
      if(opts.onChange) try{ opts.onChange(exportar()); }catch(e){}
    },300);
  }

  /* ---------- cálculos ligados ao estado ---------- */
  const triagem = cid => calc.triagem(BYID[cid].notas, CRIT, state.pesos);
  const obrigPts = cid => calc.obrigPts(BYID[cid].notas, CRIT);
  const validacao = cid => calc.validacao(state.resp[cid].A);
  const aderencia = cid => calc.aderencia(state.resp[cid].B);
  const finalScore = cid => calc.final(triagem(cid), validacao(cid), aderencia(cid), state.fase);
  function pendentes(cid){
    const a=Object.values(state.resp[cid].A).filter(x=>!x.s).length;
    const b=Object.values(state.resp[cid].B).filter(x=>!x.s).length;
    return {a,b,total:a+b};
  }
  function bloqueios(cid){
    return qA(cid).filter(q=>OBRIG.includes(q.crit) && state.resp[cid].A[q.id].s==="N")
      .map(q=>`${q.id} (${q.crit} · ${critNome(q.crit)}, obrigatório) não confirmado: “${q.trecho}”`);
  }
  const emDisputa = () => APROV.concat(LIMI.filter(c=>state.incluirLimitrofes.includes(c.id)));
  const ranking = () => calc.ranking(emDisputa(), CRIT, state.pesos);

  /* ---------- cabeçalho ---------- */
  const meta=[];
  if(V.area) meta.push(["Área",V.area]);
  if(V.local||V.modelo) meta.push(["Local",[V.local,({presencial:"presencial",hibrido:"híbrido",remoto:"remoto"})[V.modelo]].filter(Boolean).join(" · ")]);
  if(V.contrato||V.faixa) meta.push(["Contrato",[V.contrato,V.faixa].filter(Boolean).join(" · ")]);
  if(V.senioridade) meta.push(["Senioridade",V.senioridade]);
  meta.push(["Triagem",dataBR(V.data)]);
  const naoAval=ALL.filter(c=>c.status==="nao_avaliado").length;
  meta.push(["Candidatos",`${ALL.length-naoAval} avaliados${naoAval?` · ${naoAval} não avaliado(s)`:""} · ${APROV.length} aprovados no filtro · Top ${TOP3.length}`]);
  if(V.afirmativa) meta.push(["Vaga afirmativa",V.afirmativa]);

  root.classList.add("painel");
  root.innerHTML = `
<header class="top"><div class="wrap">
  <div class="vl-brand"><span class="vl-chip" aria-hidden="true">CV</span><span>triagem_cv<span class="vl-cursor" aria-hidden="true"></span></span><span class="vl-endosso">· um projeto vini_lab</span></div>
  <div class="eyebrow">processo seletivo${V.area?" · "+esc(V.area.toLowerCase()):""}</div>
  <h1>${esc(V.titulo)}</h1>
  <div class="meta">${meta.map(([k,v])=>`<span>${esc(k)} <b>${esc(v)}</b></span>`).join("")}</div>
  <div class="toolbar">
    <button class="primary" id="btn-export" type="button">Exportar JSON</button>
    <button id="btn-import" type="button">Importar JSON</button>
    <input type="file" id="file-import" accept=".json,application/json" hidden>
    <button id="btn-report" type="button">Baixar relatório (HTML para imprimir/PDF)</button>
    <button id="btn-reset" type="button">Limpar respostas</button>
    ${opts.extraToolbar||""}
    <span class="savestate" id="savestate"></span>
  </div>
  <div id="iozone"></div>
</div></header>
<nav class="tabs" aria-label="Seções"><div class="wrap" role="tablist" id="tablist"></div></nav>
<main><div class="wrap" id="view"></div></main>`;

  /* ---------- render ---------- */
  let tab = "geral";
  const TABS = [{id:"geral",t:"Triagem e critérios"}].concat(TOP3.map(cid=>({id:cid,t:shortName(cid)}))).concat(TOP3.length?[{id:"comp",t:"Comparativo e decisão"}]:[]);
  function renderTabs(){
    root.querySelector("#tablist").innerHTML = TABS.map(t=>{
      let mini="";
      if(TOP3.includes(t.id)){ const p=pendentes(t.id).total; mini=`<span class="mini" data-pend="${t.id}">${p? p+" pend.":"ok"}</span>`; }
      return `<button role="tab" type="button" id="tab-${t.id}" data-tab="${t.id}" aria-selected="${t.id===tab}">${esc(t.t)}${mini}</button>`;
    }).join("");
  }
  function render(){
    renderTabs();
    const v=root.querySelector("#view");
    if(tab==="geral") v.innerHTML=viewGeral();
    else if(tab==="comp") v.innerHTML=viewComp();
    else v.innerHTML=viewCand(tab);
    refresh();
  }
  const cidade = c => showCity ? (c.cidade||"—") : "";
  function notaRow(k,n){
    if(!n) return `<tr><td class="num">${k.id}</td><td class="num">—</td><td colspan="2" class="hint">sem nota</td></tr>`;
    return `<tr><td class="num">${k.id}</td><td class="num">${n.nota}/5</td><td><span class="tag ${esc(n.natureza)}">${esc(NAT[n.natureza]||n.natureza)}</span></td><td><span class="quote">${esc(n.trecho)}</span>${n.comentario?`<div class="hint">${n.natureza==="inferencia"?'<span class="inf">Inferência:</span> ':""}${esc(n.comentario)}</div>`:""}</td></tr>`;
  }
  function viewGeral(){
    const pesosRows = CRIT.map(c=>`<tr><td class="num">${c.id}</td><td>${esc(c.nome)}</td><td><span class="chip ${c.tipo==="O"?"o":"d"}">${c.tipo==="O"?"Obrigatório":"Desejável"}</span></td>
      <td><input type="number" min="0" max="100" step="1" id="peso-${c.id}" data-peso="${c.id}" value="${state.pesos[c.id]}" aria-label="Peso ${c.id}"></td><td class="num hint">${c.peso}</td></tr>`).join("");
    const comNotas = ALL.filter(c=>c.notas);
    const evid = comNotas.map(c=>`<details><summary>${esc(c.nome)} — ${({aprovado:"aprovado",eliminado:"eliminado",limitrofe:"limítrofe"})[c.status]} · notas e trechos</summary><div class="tablewrap"><table><thead><tr><th>Critério</th><th>Nota</th><th>Natureza</th><th>Trecho do currículo</th></tr></thead><tbody>
      ${CRIT.map(k=>notaRow(k,c.notas[k.id])).join("")}</tbody></table></div></details>`).join("");
    const fora = FORA.map(c=>{
      const st = c.status==="limitrofe" ? '<span class="chip warn">Limítrofe</span>' : c.status==="nao_avaliado" ? '<span class="chip res">Não avaliado</span>' : '<span class="chip eli">Eliminado</span>';
      const falt = (c.requisitosFaltantes||[]).map(id=>`${id} · ${critNome(id)}`).join("; ");
      const incl = c.status==="limitrofe" ? `<div class="hint"><b>Critério de inclusão:</b> ${esc(c.criterioInclusao)}</div><label class="chk"><input type="checkbox" data-limi="${c.id}" ${state.incluirLimitrofes.includes(c.id)?"checked":""}> Incluir no ranking (simulação)</label>` : "";
      return `<tr><td>${esc(c.nome)}<div>${st}</div></td><td>${falt?`<b>Faltou:</b> ${esc(falt)}<br>`:""}${esc(c.motivo||"")}${incl}</td></tr>`;
    }).join("");
    const avisosFixos = (P.avisos||[]).map(a=>`<div class="alertbox warn">${esc(a)}</div>`).join("");
    return `
    <section class="panel">
      <div><h2>Ranking da triagem</h2><p class="sub">Score = soma(nota ÷ 5 × peso) ÷ soma dos pesos × 100. Desempate: soma das notas obrigatórias, depois experiência mais recente e mais próxima da vaga. Recalcula quando você muda os pesos.</p></div>
      <div class="tablewrap"><table><thead><tr><th>#</th><th>Candidato</th>${showCity?"<th>Cidade</th>":""}<th>Score</th><th>Obrig.</th><th>Status</th></tr></thead><tbody id="rank-body"></tbody></table></div>
      <div id="rank-note"></div>
      ${avisosFixos}
      <h3>Fora da disputa: eliminados, limítrofes e não avaliados</h3>
      ${FORA.length?`<div class="tablewrap"><table><thead><tr><th>Candidato</th><th>Requisito que faltou e motivo</th></tr></thead><tbody>${fora}</tbody></table></div>`:'<p class="hint">Ninguém foi eliminado.</p>'}
    </section>
    <section class="panel">
      <div><h2>Critérios e pesos</h2><p class="sub">${esc(V.fonteRequisitos||"Requisitos da vaga.")} Os pesos são sugestão da triagem (coluna “Sugerido”); ajuste à vontade.</p></div>
      <div class="tablewrap"><table><thead><tr><th>ID</th><th>Critério</th><th>Tipo</th><th>Peso</th><th>Sugerido</th></tr></thead><tbody>${pesosRows}</tbody></table></div>
      <p class="hint" id="peso-soma"></p>
    </section>
    <section class="panel">
      <div><h2>Evidências por candidato</h2><p class="sub">Cada nota cita o trecho literal do currículo. Habilidade só listada, sem experiência que a mostre, vale como declarada, não evidenciada (nota máxima 3). Dados pessoais fora do escopo profissional não entram na análise.</p></div>
      ${evid||'<p class="hint">Sem notas.</p>'}
    </section>`;
  }

  function viewCand(cid){
    const c=BYID[cid], r=state.resp[cid];
    const blocoA = qA(cid).map(q=>{
      const x=r.A[q.id]; const o=OBRIG.includes(q.crit);
      return `<article class="q" data-st="${x.s}" id="card-${cid}-${q.id}">
        <div class="qhead"><span class="qid">${q.id}</span><span class="chip ${o?"o":"d"}">${q.crit} · ${o?"obrigatório":"desejável"}</span></div>
        <p class="quote">${esc(q.trecho)}</p>
        <p class="qtext">${esc(q.q)}</p>
        <div class="pair"><div class="good"><span class="lab">Boa resposta mostra</span>${esc(q.boa)}</div><div class="bad"><span class="lab">Sinal de alerta</span>${esc(q.alerta)}</div></div>
        <div class="segs" role="radiogroup" aria-label="Status ${q.id}">
          ${["C","P","N"].map(k=>`<label class="seg s${k}"><input type="radio" name="${cid}-${q.id}" id="${cid}-${q.id}-${k}" data-a="${cid}|${q.id}" value="${k}" ${x.s===k?"checked":""}>${ST[k].t}</label>`).join("")}
          <button type="button" class="clr" data-clear-a="${cid}|${q.id}">Limpar</button>
        </div>
        <textarea id="${cid}-${q.id}-n" data-an="${cid}|${q.id}" placeholder="Anotações da entrevista" aria-label="Anotação ${q.id}">${esc(x.n)}</textarea>
      </article>`;
    }).join("");
    const blocoB = bFor(cid).map(q=>{
      const x=r.B[q.id];
      return `<article class="q" data-filled="${x.s?1:0}" id="card-${cid}-${q.id}">
        <div class="qhead"><span class="qid">${q.id}</span><span class="chip d">${q.crit} · ${esc(critNome(q.crit))}</span>${q.id==="B7"?'<span class="chip top">Específica</span>':""}</div>
        <p class="qtext">${esc(q.q)}</p>
        <div class="rubric"><div><b>1</b> · ${esc(q.a1)}</div><div><b>3</b> · ${esc(q.a3)}</div><div><b>5</b> · ${esc(q.a5)}</div></div>
        <div class="segs" role="radiogroup" aria-label="Nota ${q.id}">
          ${[1,2,3,4,5].map(n=>`<label class="seg"><input type="radio" name="${cid}-${q.id}" id="${cid}-${q.id}-${n}" data-b="${cid}|${q.id}" value="${n}" ${x.s===n?"checked":""}>${n}</label>`).join("")}
          <button type="button" class="clr" data-clear-b="${cid}|${q.id}">Limpar</button>
        </div>
        <textarea id="${cid}-${q.id}-n" data-bn="${cid}|${q.id}" placeholder="Anotações: evidências da resposta" aria-label="Anotação ${q.id}">${esc(x.n)}</textarea>
      </article>`;
    }).join("");
    const inf = x => x.inferencia? ' <span class="inf">(inferência)</span>':"";
    return `
    <section class="panel">
      <div class="row"><h2>${esc(c.nome)}</h2><span class="chip top">Top ${TOP3.length}</span></div>
      <p class="sub">${esc(c.cargo||"")}${showCity&&c.cidade?" · "+esc(c.cidade):""}</p>
      <div class="scorebar">
        <div class="score"><div class="k">Triagem</div><div class="v" data-tri="${cid}"></div></div>
        <div class="score"><div class="k">Validação</div><div class="v" data-val="${cid}"></div></div>
        <div class="score"><div class="k">Aderência</div><div class="v" data-ade="${cid}"></div></div>
        <div class="score final"><div class="k">Final</div><div class="v" data-fin="${cid}"></div></div>
      </div>
      <div data-block="${cid}"></div>
      <div class="grid3">
        <div><h3>Pontos fortes</h3><ul class="list">${(c.fortes||[]).map(f=>`<li>${esc(f.texto)}${inf(f)}<p class="quote">${esc(f.trecho)}</p></li>`).join("")}</ul></div>
        <div><h3>Riscos</h3><ul class="list">${(c.riscos||[]).map(f=>`<li>${esc(f.texto)}${inf(f)}<p class="quote">${esc(f.trecho)}</p></li>`).join("")}</ul></div>
        <div><h3>Inconsistências a validar</h3><ul class="list">${(c.inconsistencias||[]).map(f=>`<li>${esc(f.texto)}${inf(f)}</li>`).join("")||'<li class="hint">Nenhuma.</li>'}</ul></div>
      </div>
    </section>
    <section class="panel">
      <div><h2>Bloco A · Validação do currículo</h2><p class="sub">Confirmado = 100, Parcial = 50, Não confirmado = 0. Um item ligado a requisito obrigatório (${OBRIG.join(", ")}) marcado Não confirmado bloqueia o candidato.</p></div>
      ${blocoA}
    </section>
    <section class="panel">
      <div><h2>Bloco B · Aderência à vaga</h2><p class="sub">As perguntas comuns são iguais para os candidatos do Top ${TOP3.length}, para comparar na mesma régua; a última é específica deste candidato. Nota de 1 a 5, convertida em (nota ÷ 5) × 100.</p></div>
      ${blocoB}
    </section>`;
  }

  function viewComp(){
    const f=state.fase;
    return `
    <section class="panel">
      <div><h2>Fórmula do score final</h2><p class="sub">Pesos de fase editáveis. A fórmula é normalizada pela soma dos pesos.</p></div>
      <div class="weights">
        <label for="fase-t">Triagem <input type="number" id="fase-t" data-fase="t" min="0" max="100" value="${f.t}"></label>
        <label for="fase-v">Validação <input type="number" id="fase-v" data-fase="v" min="0" max="100" value="${f.v}"></label>
        <label for="fase-a">Aderência <input type="number" id="fase-a" data-fase="a" min="0" max="100" value="${f.a}"></label>
      </div>
      <div class="formula" id="formula"></div>
    </section>
    <section class="panel">
      <h2>Lado a lado</h2>
      <div class="tablewrap"><table class="cmp"><thead><tr><th></th>${TOP3.map(cid=>`<th>${esc(BYID[cid].nome)}</th>`).join("")}</tr></thead><tbody id="cmp-body"></tbody></table></div>
    </section>
    <section class="panel">
      <h2>Recomendação</h2>
      <div id="reco"></div>
    </section>
    <section class="panel">
      <h2>Decisão final</h2>
      <label class="row" for="dec-cand">Pessoa escolhida
        <select id="dec-cand"><option value="">Selecione</option>${TOP3.map(cid=>`<option value="${cid}" ${state.decisao.cand===cid?"selected":""}>${esc(BYID[cid].nome)}</option>`).join("")}<option value="nenhum" ${state.decisao.cand==="nenhum"?"selected":""}>Nenhum (reabrir processo)</option></select>
      </label>
      <textarea id="dec-texto" aria-label="Justificativa da decisão" placeholder="Justificativa da decisão (fica registrada no JSON e no relatório)">${esc(state.decisao.texto)}</textarea>
    </section>`;
  }

  /* Atualiza só os números, sem recriar campos (não perde o foco) */
  function refresh(){
    const $$ = s => root.querySelectorAll(s);
    TOP3.forEach(cid=>{
      const p=pendentes(cid).total;
      $$(`[data-pend="${cid}"]`).forEach(e=>e.textContent=p? p+" pend.":"ok");
      $$(`[data-tri="${cid}"]`).forEach(e=>e.textContent=fmt(triagem(cid)));
      $$(`[data-val="${cid}"]`).forEach(e=>e.textContent=fmt(validacao(cid)));
      $$(`[data-ade="${cid}"]`).forEach(e=>e.textContent=fmt(aderencia(cid)));
      $$(`[data-fin="${cid}"]`).forEach(e=>{ const b=bloqueios(cid).length; e.textContent= b? "Bloq." : fmt(finalScore(cid)); });
      $$(`[data-block="${cid}"]`).forEach(e=>{
        const b=bloqueios(cid);
        e.innerHTML = b.length ? `<div class="alertbox bad" role="alert"><b>Candidato bloqueado.</b> ${b.map(esc).join("; ")}</div>` : "";
      });
    });
    const rb=root.querySelector("#rank-body");
    if(rb){
      const rk=ranking();
      const top=rk.slice(0,3).map(x=>x.id);
      rb.innerHTML = rk.map((x,i)=>{
        const c=BYID[x.id];
        const st = c.status==="limitrofe" ? '<span class="chip warn">Limítrofe (simulação)</span>' : (TOP3.includes(x.id) ? `<span class="chip top">Top ${TOP3.length}</span>` : '<span class="chip res">Reserva</span>');
        return `<tr data-rank="${x.id}"><td class="num">${i+1}</td><td>${esc(c.nome)}</td>${showCity?`<td>${esc(cidade(c))}</td>`:""}<td class="num" data-score="${x.id}">${fmt(x.score)}</td><td class="num">${x.obr}/${OBRIG.length*5}</td><td>${st}</td></tr>`;
      }).join("") + FORA.filter(c=>!(c.status==="limitrofe"&&state.incluirLimitrofes.includes(c.id))).map(c=>`<tr><td class="num">—</td><td>${esc(c.nome)}</td>${showCity?"<td>—</td>":""}<td class="num">—</td><td class="num">—</td><td>${c.status==="limitrofe"?'<span class="chip warn">Limítrofe</span>':c.status==="nao_avaliado"?'<span class="chip res">Não avaliado</span>':'<span class="chip eli">Eliminado</span>'}</td></tr>`).join("");
      const diff = top.length!==TOP3.length || top.some(c=>!TOP3.includes(c));
      const av = calc.avisos(rk, NOMES);
      root.querySelector("#rank-note").innerHTML =
        (diff ? `<div class="alertbox warn" id="top-mudou">Com estes pesos o Top 3 mudaria para: ${top.map(c=>esc(BYID[c].nome)).join(", ")}. As abas de entrevista continuam com o Top 3 original; rode a análise de novo para gerar as perguntas dos novos nomes.</div>` : "") +
        av.map(a=>`<div class="alertbox warn">${esc(a)}</div>`).join("");
      const so=CRIT.filter(c=>c.tipo==="O").reduce((a,c)=>a+(+state.pesos[c.id]||0),0), sd=CRIT.filter(c=>c.tipo==="D").reduce((a,c)=>a+(+state.pesos[c.id]||0),0);
      root.querySelector("#peso-soma").textContent = `Soma: obrigatórios ${so} + desejáveis ${sd} = ${so+sd}. O score é normalizado, então a soma não precisa dar 100.`;
    }
    const fo=root.querySelector("#formula");
    if(fo){
      const f=state.fase, w=(+f.t||0)+(+f.v||0)+(+f.a||0);
      fo.textContent = `Final = (${f.t} × Triagem + ${f.v} × Validação + ${f.a} × Aderência) ÷ ${w}`;
      const rows=[
        ["Triagem",cid=>fmt(triagem(cid)),cid=>triagem(cid)],
        ["Validação (Bloco A)",cid=>fmt(validacao(cid)),cid=>validacao(cid)],
        ["Aderência (Bloco B)",cid=>fmt(aderencia(cid)),cid=>aderencia(cid)],
        ["Score final",cid=>bloqueios(cid).length?"Bloqueado":fmt(finalScore(cid)),cid=>bloqueios(cid).length?null:finalScore(cid)]
      ];
      let html = rows.map(([lab,fn,raw])=>{
        const vals=TOP3.map(raw); const ok=vals.filter(v=>v!==null); const max=ok.length?Math.max(...ok):NaN;
        return `<tr><th scope="row">${lab}</th>${TOP3.map((cid,i)=>`<td class="num ${vals[i]!==null&&vals[i]===max?"best":""}">${fn(cid)}</td>`).join("")}</tr>`;
      }).join("");
      html += `<tr><th scope="row">Bloqueio</th>${TOP3.map(cid=>{const b=bloqueios(cid);return `<td>${b.length?`<span class="chip bad">Bloqueado</span><div class="hint">${b.map(esc).join("<br>")}</div>`:'<span class="chip ok">Livre</span>'}</td>`;}).join("")}</tr>`;
      html += `<tr><th scope="row">Alertas da validação</th>${TOP3.map(cid=>{const al=qA(cid).filter(q=>["P","N"].includes(state.resp[cid].A[q.id].s));const lb=bFor(cid).filter(q=>state.resp[cid].B[q.id].s>0&&state.resp[cid].B[q.id].s<=2);return `<td>${al.length||lb.length?al.map(q=>`<span class="chip ${ST[state.resp[cid].A[q.id].s].cls}">${q.id} ${ST[state.resp[cid].A[q.id].s].t}</span>`).concat(lb.map(q=>`<span class="chip warn">${q.id} nota ${state.resp[cid].B[q.id].s}</span>`)).join(" "):'<span class="hint">Nenhum</span>'}</td>`;}).join("")}</tr>`;
      html += `<tr><th scope="row">Pendências</th>${TOP3.map(cid=>{const p=pendentes(cid);return `<td class="num">${p.total? `${p.a} no A · ${p.b} no B`:"Completo"}</td>`;}).join("")}</tr>`;
      root.querySelector("#cmp-body").innerHTML=html;
      root.querySelector("#reco").innerHTML=recoHtml();
    }
  }

  function reservaTexto(){
    return ranking().filter(x=>!TOP3.includes(x.id)).map(x=>BYID[x.id].nome.split(" ")[0]).join(", depois ") || "não há reserva aprovada";
  }
  function recoHtml(){
    const pend=TOP3.reduce((a,c)=>a+pendentes(c).total,0);
    if(pend) return `<div class="alertbox warn" id="reco-pendente">A recomendação aparece quando todas as notas estiverem preenchidas. Faltam ${pend} itens.</div>`;
    const livres=TOP3.filter(c=>!bloqueios(c).length).map(c=>({cid:c,f:finalScore(c)})).sort((a,b)=>b.f-a.f);
    if(!livres.length) return `<div class="alertbox bad" id="reco-final">Todos os candidatos estão bloqueados por requisito obrigatório não confirmado. Recomendação: reabrir o processo e chamar a reserva (${esc(reservaTexto())}).</div>`;
    const w=livres[0], c=BYID[w.cid], r=state.resp[w.cid];
    const conf=qA(w.cid).filter(q=>r.A[q.id].s==="C"), parc=qA(w.cid).filter(q=>["P","N"].includes(r.A[q.id].s));
    const fortesB=bFor(w.cid).filter(q=>r.B[q.id].s>=4), fracosB=bFor(w.cid).filter(q=>r.B[q.id].s<=2);
    const nota=t=> t? ` — <i>${esc(t)}</i>`:"";
    const segundo=livres[1];
    const margem = segundo ? w.f-segundo.f : null;
    let h = `<div class="alertbox ok" id="reco-final"><b>Recomendação: ${esc(c.nome)}</b> · score final ${fmt(w.f)} (triagem ${fmt(triagem(w.cid))}, validação ${fmt(validacao(w.cid))}, aderência ${fmt(aderencia(w.cid))}).</div>`;
    if(segundo) h += `<p>Vantagem de ${fmt(margem)} pontos sobre ${esc(BYID[segundo.cid].nome)} (${fmt(segundo.f)}).${margem<5?' <b>Margem estreita: decida pelas anotações, não só pelo número.</b>':''}</p>`;
    const bl=TOP3.filter(c2=>bloqueios(c2).length);
    if(bl.length) h += `<p>Fora da disputa por bloqueio: ${bl.map(x=>esc(BYID[x].nome)).join(", ")}.</p>`;
    h += `<h3>Justificativa a partir das suas anotações</h3><ul class="list">`;
    h += conf.length? `<li>Confirmado no currículo: ${conf.map(q=>`${q.id} (${q.crit})${nota(r.A[q.id].n)}`).join("; ")}</li>`:"";
    h += fortesB.length? `<li>Melhores respostas de aderência: ${fortesB.map(q=>`${q.id} nota ${r.B[q.id].s}${nota(r.B[q.id].n)}`).join("; ")}</li>`:"";
    h += parc.length? `<li>Ressalvas da validação: ${parc.map(q=>`${q.id} ${ST[r.A[q.id].s].t}${nota(r.A[q.id].n)}`).join("; ")}</li>`:"";
    h += fracosB.length? `<li>Pontos a desenvolver: ${fracosB.map(q=>`${q.id} nota ${r.B[q.id].s}${nota(r.B[q.id].n)}`).join("; ")}</li>`:"";
    h += `</ul>`;
    return h;
  }

  /* ---------- eventos ---------- */
  on("click",e=>{
    const t=e.target.closest("[data-tab]");
    if(t){ tab=t.dataset.tab; render(); try{ window.scrollTo({top:0}); }catch(_){} return; }
    const ca=e.target.closest("[data-clear-a]");
    if(ca){ const [cid,q]=ca.dataset.clearA.split("|"); state.resp[cid].A[q].s=""; root.querySelectorAll(`input[name="${cid}-${q}"]`).forEach(i=>i.checked=false); root.querySelector(`#card-${cid}-${q}`).dataset.st=""; persist(); refresh(); return; }
    const cb=e.target.closest("[data-clear-b]");
    if(cb){ const [cid,q]=cb.dataset.clearB.split("|"); state.resp[cid].B[q].s=0; root.querySelectorAll(`input[name="${cid}-${q}"]`).forEach(i=>i.checked=false); root.querySelector(`#card-${cid}-${q}`).dataset.filled="0"; persist(); refresh(); return; }
  });
  on("change",e=>{
    const el=e.target;
    if(el.dataset.a){ const [cid,q]=el.dataset.a.split("|"); state.resp[cid].A[q].s=el.value; root.querySelector(`#card-${cid}-${q}`).dataset.st=el.value; persist(); refresh(); }
    else if(el.dataset.b){ const [cid,q]=el.dataset.b.split("|"); state.resp[cid].B[q].s=Number(el.value); root.querySelector(`#card-${cid}-${q}`).dataset.filled="1"; persist(); refresh(); }
    else if(el.dataset.limi){ const id=el.dataset.limi; state.incluirLimitrofes=state.incluirLimitrofes.filter(x=>x!==id); if(el.checked) state.incluirLimitrofes.push(id); persist(); refresh(); }
    else if(el.id==="dec-cand"){ state.decisao.cand=el.value; persist(); }
  });
  on("input",e=>{
    const el=e.target;
    if(el.dataset.an){ const [cid,q]=el.dataset.an.split("|"); state.resp[cid].A[q].n=el.value; persist(); }
    else if(el.dataset.bn){ const [cid,q]=el.dataset.bn.split("|"); state.resp[cid].B[q].n=el.value; persist(); }
    else if(el.dataset.peso){ const v=Number(el.value); state.pesos[el.dataset.peso]= isFinite(v)&&v>=0 ? v : 0; persist(); refresh(); }
    else if(el.dataset.fase){ const v=Number(el.value); state.fase[el.dataset.fase]= isFinite(v)&&v>=0 ? v : 0; persist(); refresh(); }
    else if(el.id==="dec-texto"){ state.decisao.texto=el.value; persist(); }
  });

  /* ---------- exportar / importar / relatório / limpar ---------- */
  function exportar(){ return Object.assign({}, P, {respostas: JSON.parse(JSON.stringify(state))}); }
  let downloadsNs=null;
  (async()=>{ try{ if(global.claude&&global.claude.use) downloadsNs=await global.claude.use("downloads"); }catch(e){} })();
  const showIO = html => { root.querySelector("#iozone").innerHTML=html; };
  async function offerFile(filename, data, label){
    if(downloadsNs){
      try{ await downloadsNs.save({filename,data}); showIO(`<div class="alertbox ok">${esc(label)} salvo.</div>`); return; }
      catch(err){ if(err&&err.code==="declined"){ showIO(""); return; } }
    }
    showIO(`<div class="iobox"><div class="alertbox warn">Este visualizador não permitiu baixar o arquivo. Copie o conteúdo abaixo e salve como <b>${esc(filename)}</b>.</div><textarea id="io-out" readonly aria-label="Conteúdo para copiar">${esc(data)}</textarea><div class="row"><button type="button" id="io-copy">Copiar</button><button type="button" id="io-close">Fechar</button><span class="hint" id="io-copied"></span></div></div>`);
    root.querySelector("#io-copy").onclick=()=>{ const ta=root.querySelector("#io-out"); const done=()=>{ root.querySelector("#io-copied").textContent="Copiado."; }; try{ navigator.clipboard.writeText(ta.value).then(done,()=>{ ta.focus(); ta.select(); }); }catch(_){ ta.focus(); ta.select(); } };
    root.querySelector("#io-close").onclick=()=>showIO("");
  }
  root.querySelector("#btn-export").addEventListener("click",()=>{
    offerFile("processo-"+V.id+".json", JSON.stringify(exportar(),null,2), "JSON");
  });
  root.querySelector("#btn-import").addEventListener("click",()=>{
    showIO(`<div class="iobox"><p class="hint">Escolha um processo.json (exportado deste painel, da skill ou do app) ou cole o conteúdo abaixo.</p><div class="row"><button type="button" id="io-file">Escolher arquivo</button></div><textarea id="io-in" placeholder="Cole o JSON aqui" aria-label="JSON para importar"></textarea><div class="row"><button class="primary" type="button" id="io-apply">Importar texto colado</button><button type="button" id="io-close">Cancelar</button></div><div id="io-msg"></div></div>`);
    root.querySelector("#io-file").onclick=()=>root.querySelector("#file-import").click();
    root.querySelector("#io-apply").onclick=()=>applyImport(root.querySelector("#io-in").value);
    root.querySelector("#io-close").onclick=()=>showIO("");
  });
  root.querySelector("#file-import").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader(); rd.onload=()=>applyImport(String(rd.result)); rd.readAsText(f); e.target.value="";
  });
  function applyImport(txt){
    const msg = h => { const m=root.querySelector("#io-msg"); if(m) m.innerHTML=h; else showIO(h); };
    let obj; try{ obj=JSON.parse(txt); }catch(err){ msg(`<div class="alertbox bad">O conteúdo não é um JSON válido. Confira se copiou o arquivo inteiro.</div>`); return; }
    if(obj && obj.schemaVersion && obj.vaga && Array.isArray(obj.candidatos)){
      if(obj.respostas){ try{ localStorage.setItem("selecao-"+obj.vaga.id+"-v1", JSON.stringify(Object.assign({},obj.respostas,{salvoEm:obj.respostas.salvoEm||new Date().toISOString()}))); }catch(e){} }
      const inst = mount(root, obj, Object.assign({}, opts, {ignorarArmazenamento:true}));
      inst.showIO(`<div class="alertbox ok">Processo importado: ${esc(obj.vaga.titulo)}.</div>`);
      if(opts.onImport) try{ opts.onImport(obj); }catch(e){}
      return;
    }
    if(obj && obj.resp){ state=mergeState(freshState(), obj); persist(); render(); showIO(`<div class="alertbox ok">Respostas importadas.</div>`); return; }
    msg(`<div class="alertbox bad">Este JSON não é um processo.json (faltam vaga e candidatos).</div>`);
  }
  root.querySelector("#btn-reset").addEventListener("click",()=>{
    showIO(`<div class="confirm alertbox warn">Apagar todas as notas, anotações e a decisão? Os pesos voltam ao sugerido. <button type="button" id="rs-yes">Apagar</button><button type="button" id="rs-no">Cancelar</button></div>`);
    root.querySelector("#rs-yes").onclick=()=>{ state=freshState(); persist(); render(); showIO(`<div class="alertbox ok">Respostas apagadas.</div>`); };
    root.querySelector("#rs-no").onclick=()=>showIO("");
  });
  root.querySelector("#btn-report").addEventListener("click",()=>offerFile("relatorio-"+V.id+".html", reportHtml(), "Relatório"));
  function reportHtml(){
    const f=state.fase;
    let b=`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Relatório — ${esc(V.titulo)}</title><style>body{font:14px/1.5 system-ui,sans-serif;color:#1d2420;max-width:860px;margin:24px auto;padding:0 16px}h1{font-size:22px}h2{font-size:18px;margin-top:28px;border-bottom:1px solid #ccc;padding-bottom:4px}table{border-collapse:collapse;width:100%;margin:8px 0}td,th{border:1px solid #ccc;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eee}.q{color:#555;font-size:13px}</style></head><body>`;
    b+=`<h1>Processo seletivo — ${esc(V.titulo)}</h1><p>${meta.map(([k,v])=>`${esc(k)}: <b>${esc(v)}</b>`).join(" · ")}</p><p>Gerado em ${esc(new Date().toLocaleString("pt-BR"))}. Fórmula: Final = (${f.t} × Triagem + ${f.v} × Validação + ${f.a} × Aderência) ÷ ${(+f.t)+(+f.v)+(+f.a)}.</p>`;
    b+=`<h2>Ranking da triagem</h2><table><tr><th>#</th><th>Candidato</th><th>Score</th><th>Status</th></tr>${ranking().map((x,i)=>`<tr><td>${i+1}</td><td>${esc(BYID[x.id].nome)}</td><td>${fmt(x.score)}</td><td>${TOP3.includes(x.id)?"Top 3":BYID[x.id].status==="limitrofe"?"Limítrofe (simulação)":"Reserva"}</td></tr>`).join("")}${FORA.map(c=>`<tr><td>—</td><td>${esc(c.nome)}</td><td>—</td><td>${esc(({eliminado:"Eliminado",limitrofe:"Limítrofe",nao_avaliado:"Não avaliado"})[c.status])}: ${esc(c.motivo||"")}</td></tr>`).join("")}</table>`;
    b+=`<h2>Top ${TOP3.length}</h2><table><tr><th>Candidato</th><th>Triagem</th><th>Validação</th><th>Aderência</th><th>Final</th><th>Bloqueio</th></tr>${TOP3.map(cid=>`<tr><td>${esc(BYID[cid].nome)}</td><td>${fmt(triagem(cid))}</td><td>${fmt(validacao(cid))}</td><td>${fmt(aderencia(cid))}</td><td>${fmt(finalScore(cid))}</td><td>${bloqueios(cid).length?esc(bloqueios(cid).join("; ")):"Livre"}</td></tr>`).join("")}</table>`;
    TOP3.forEach(cid=>{
      const c=BYID[cid], r=state.resp[cid];
      b+=`<h2>${esc(c.nome)}</h2><h3>Bloco A — Validação</h3><table><tr><th>Item</th><th>Afirmação do CV</th><th>Status</th><th>Anotação</th></tr>${qA(cid).map(q=>`<tr><td>${q.id} (${q.crit})</td><td class="q">${esc(q.trecho)}</td><td>${r.A[q.id].s?ST[r.A[q.id].s].t:"Pendente"}</td><td>${esc(r.A[q.id].n)}</td></tr>`).join("")}</table>`;
      b+=`<h3>Bloco B — Aderência</h3><table><tr><th>Item</th><th>Pergunta</th><th>Nota</th><th>Anotação</th></tr>${bFor(cid).map(q=>`<tr><td>${q.id} (${q.crit})</td><td class="q">${esc(q.q)}</td><td>${r.B[q.id].s||"Pendente"}</td><td>${esc(r.B[q.id].n)}</td></tr>`).join("")}</table>`;
    });
    const dc=state.decisao.cand==="nenhum"?"Nenhum (reabrir processo)":(BYID[state.decisao.cand]?BYID[state.decisao.cand].nome:"Não registrada");
    b+=`<h2>Recomendação</h2>${recoHtml()}<h2>Decisão final</h2><p><b>${esc(dc)}</b></p><p>${esc(state.decisao.texto).replace(/\n/g,"<br>")}</p><p class="q">Abra este arquivo no navegador e use Imprimir → Salvar como PDF.</p></body></html>`;
    return b;
  }

  render();
  const inst = {
    destroy(){ ctl.abort(); clearTimeout(saveTimer); },
    exportar, showIO,
    getState(){ return JSON.parse(JSON.stringify(state)); },
    ranking
  };
  current = inst;
  return inst;
}

global.PainelSelecao = {mount, calc, versao:"1.0", atual:()=>current};
})(window);
</script>
<!-- PAINEL:ENGINE:FIM -->
<script>
(function(){
  const root=document.getElementById("painel-root");
  let dados=null;
  try{ dados=JSON.parse(document.getElementById("processo-data").textContent); }catch(e){}
  if(!dados || !dados.vaga){
    root.innerHTML='<div style="max-width:720px;margin:40px auto;padding:0 16px;font-family:system-ui,sans-serif"><h1 style="font-size:22px">Painel do processo seletivo</h1><p>Este é o template vazio. Gere o painel com <code>gerar_painel.py processo.json</code>.</p></div>';
    return;
  }
  document.title = "Painel · " + dados.vaga.titulo;
  window.painel = PainelSelecao.mount(root, dados);
})();
</script>
</body>
</html>
